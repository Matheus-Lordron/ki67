# R-01: todo pull request (e todo push na main) passa por lint, tipos, testes e build web.
# Não usa segredos nem fala com o Supabase ou o Cloudflare reais.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Em PR, um push novo cancela a execução anterior; na main, toda execução vai até o fim.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: App (lint, tipos, testes, build web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # O build roda sem .env: o app sobe em modo demonstração.
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      # As versões de react, react-native e expo-* precisam casar com o Expo instalado.
      # Offline: compara com a lista que vem no próprio pacote expo, sem depender da rede.
      - name: Versões compatíveis com o Expo
        run: npx expo install --check
        env:
          EXPO_OFFLINE: '1'

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes
        run: npx jest --ci

      - name: Build web
        run: npx expo export --platform web --output-dir dist

  # R-04: as migrações sobem num banco limpo e os testes pgTAP passam.
  # Supabase local no runner (Docker); nada fala com o Supabase real.
  banco:
    name: Banco (migrações e pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Subir o Postgres do Supabase
        run: npx --yes supabase@2.122.0 db start

      - name: Aplicar as migrações num banco limpo
        run: npx --yes supabase@2.122.0 db reset --local

      - name: Testes do banco (pgTAP)
        run: npx --yes supabase@2.122.0 test db

  # R-06: Edge Functions checadas e testadas com Supabase, R2 e Resend simulados.
  # --allow-net=none: nenhum teste consegue falar com um serviço de verdade.
  funcoes:
    name: Edge Functions (deno test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7

      - name: Checagem de tipos
        run: deno check ./*/index.ts

      - name: Testes
        run: deno test --allow-env --allow-net=none tests/

  # R-02: nenhum segredo no histórico. Varre todos os commits, não só o diff.
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Varredura de segredos
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --no-banner --exit-code 1

  # R-03: mensagens dos commits do PR no padrão do docs/03 (commitlint.config.mjs).
  commits:
    name: Mensagens de commit (commitlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Testes da configuração
        run: node --test .github/tests/commitlint.test.mjs

      - name: Commits do pull request
        run: >
          npx --yes @commitlint/cli@21.2.3 --config commitlint.config.mjs --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  # R-02: o CI falha com vulnerabilidade crítica; alta e moderada aparecem no resumo.
  dependencias:
    name: Dependências (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Relatório completo
        run: |
          {
            echo '## npm audit (apps/mobile)'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bloqueia vulnerabilidade crítica
        run: npm audit --audit-level=critical
