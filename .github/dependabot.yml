# R-02: atualizações semanais, agrupadas para não encher a fila de pull requests.
# Correções de segurança chegam na hora, fora desta agenda (Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # Versão maior de qualquer pacote: atualização planejada, não automática.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # O Expo trava a versão destes pacotes; eles sobem juntos com `npx expo install --fix`
      # (o CI recusa versão fora da lista do Expo).
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: 'babel-preset-expo'
      - dependency-name: 'jest-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: '@react-native-community/netinfo'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
